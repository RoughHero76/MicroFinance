<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2C3E50" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EviFinance</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: Inter-Regular, system-ui, sans-serif; }
      body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; }
      /* Keyboard focus ring for tabbing; mouse and touch stay clean. */
      :focus-visible { outline: 2px solid #5b8def; outline-offset: 2px; }
      /* Text fields draw their own focused border. */
      input:focus-visible, textarea:focus-visible { outline: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
